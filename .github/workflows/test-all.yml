name: Test (All)

on:
  [push, pull_request]

jobs:
  test:
    name: Docker Compose test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test images
        run: |
          docker compose -f docker-compose.test.yml build

      - name: Start dependencies
        run: |
          docker compose -f docker-compose.test.yml up -d postgres redis mitmproxy middle-auth-server middle-auth-server-ssl

      - name: Run pytest (all tests)
        run: |
          docker compose -f docker-compose.test.yml run --rm test-runner pytest -q

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v --remove-orphans
